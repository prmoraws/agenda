name: ${COMPOSE_PROJECT_NAME:-agenda}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda-app
    restart: unless-stopped
    environment:
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agenda}
      SCHEDULER_TIMEZONE: ${DOMO_SCHEDULER_TIMEZONE:-America/Bahia}
    ports:
      - "127.0.0.1:${AGENDA_PORT:-3010}:3010"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - edge

  postgres:
    image: postgres:17-alpine
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Bahia}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    name: agenda-backend
    internal: true
  edge:
    name: agenda-edge

volumes:
  postgres_data:
    name: agenda_postgres_data
